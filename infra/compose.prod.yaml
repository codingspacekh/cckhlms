# Production on the VPS (architecture §9). No ports are published: all traffic arrives through the
# Cloudflare Tunnel. The database sits on an internal network with no internet access.
# Secrets come from /opt/cckhlms/.env (never in git); APP_TAG is set by deploy.sh.
name: cckhlms

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    # Terse errors: no DETAIL lines, which can hold a student's username (NFR-07).
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=50', '-c', 'log_error_verbosity=terse']
    # postgres is the superuser, used only by hand inside this container. The app and backups use lms, the database's
    # owner but not a superuser, which db-app-role.sh creates when the data volume is first set up (pre-launch review).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      LMS_DB_PASSWORD: ${LMS_DB_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql, ./db-app-role.sh:/docker-entrypoint-initdb.d/app-role.sh:ro]
    networks: [internal]
    mem_limit: 768m
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # On TCP: on first start the image runs a socket-only server for db-app-role.sh, which isn't ready yet.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U lms -d lms']
      interval: 5s
      retries: 20

  app:
    image: cckhlms-app:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://lms:${LMS_DB_PASSWORD}@db:5432/lms
      BETTER_AUTH_URL: https://${LMS_HOST:-lms.cckh.dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      PREVIEW_ORIGIN: https://${PREVIEW_HOST:-preview.cckh.dev}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ADMIN_RESET_USERNAME: ${ADMIN_RESET_USERNAME:-} # lost admin password, runbook §3.2
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-}
      WEB_WORKERS: '2' # one server process per vCPU (M7 load test)
      RUNNER_URL: unix:/run/runner/runner.sock
    volumes: [uploads:/app/uploads, runner-socket:/run/runner]
    networks: [internal, edge]
    mem_limit: 1g
    # Locked down (M7): the image can't be changed, and the app needs no Linux capabilities. It writes only to its
    # uploads volume and two small in-memory folders (infra/tests/app-image.sh runs it this way).
    read_only: true
    tmpfs: ['/tmp:size=64m', '/app/.next/cache:size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  # Runs students' Python and Java (M11, ADR-0004). No network at all: the app reaches it through a socket in a volume
  # they share, which only the app's group (101) may open. Every capability is dropped but the four it needs to run
  # each program as its own user and stop it; programs get their own folder in /work and strict limits (runner.py).
  runner:
    image: cckhlms-runner:${RUNNER_TAG:-current} # deploy.sh sets it; `current` for commands typed by hand
    restart: unless-stopped
    network_mode: none
    volumes: [runner-socket:/sock]
    read_only: true
    tmpfs: ['/work:size=96m,mode=755', '/tmp:size=16m']
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    pids_limit: 512
    cpus: 1.5
    healthcheck:
      test: ['CMD', 'python3', '-I', '-c', "import socket; socket.socket(socket.AF_UNIX).connect('/sock/runner.sock')"]
      interval: 15s
      retries: 3

  preview:
    image: cckhlms-preview:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    read_only: true
    environment:
      LMS_ORIGIN: https://${LMS_HOST:-lms.cckh.dev}
      PREVIEW_PORT: '8080'
    networks: [edge]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    networks: [edge]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  backup:
    image: cckhlms-backup:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      TZ: Asia/Phnom_Penh
      PGHOST: db
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${LMS_DB_PASSWORD}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set in .env}
      UPLOADS_OWNER: '100:101' # the app's user (Dockerfile): restored lesson files belong to it
      BACKUP_REMOTE: r2:${R2_BUCKET:?set in .env}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set in .env}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set in .env}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:?set in .env}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
    volumes: [uploads:/uploads:ro]
    networks: [internal, edge]
    mem_limit: 256m
    security_opt: ['no-new-privileges:true']

networks:
  internal: { internal: true }
  edge: {}

volumes:
  pgdata: {}
  uploads: {}
  runner-socket: {}
