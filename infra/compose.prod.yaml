# Production on the VPS (architecture §9). No ports are published: all traffic arrives through the
# Cloudflare Tunnel. The database sits on an internal network with no internet access.
# Secrets come from /opt/cckhlms/.env (never in git); APP_TAG is set by deploy.sh.
name: cckhlms

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    # Terse errors: no DETAIL lines, which can hold a student's username (NFR-07).
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=50', '-c', 'log_error_verbosity=terse']
    environment:
      POSTGRES_USER: lms
      POSTGRES_DB: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [internal]
    mem_limit: 768m
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms -d lms']
      interval: 5s
      retries: 20

  app:
    image: cckhlms-app:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://lms:${POSTGRES_PASSWORD}@db:5432/lms
      BETTER_AUTH_URL: https://${LMS_HOST:-lms.cckh.dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      PREVIEW_ORIGIN: https://${PREVIEW_HOST:-preview.cckh.dev}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes: [uploads:/app/uploads]
    networks: [internal, edge]
    mem_limit: 1g
    # Locked down (M7): the image can't be changed, and the app needs no Linux capabilities. It writes only to its
    # uploads volume and two small in-memory folders (infra/tests/app-image.sh runs it this way).
    read_only: true
    tmpfs: ['/tmp:size=64m', '/app/.next/cache:size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  preview:
    image: cckhlms-preview:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    read_only: true
    environment:
      LMS_ORIGIN: https://${LMS_HOST:-lms.cckh.dev}
      PREVIEW_PORT: '8080'
    networks: [edge]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in .env}
    networks: [edge]
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  backup:
    image: cckhlms-backup:${APP_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      TZ: Asia/Phnom_Penh
      PGHOST: db
      PGUSER: lms
      PGDATABASE: lms
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set in .env}
      BACKUP_REMOTE: r2:${R2_BUCKET:?set in .env}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set in .env}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set in .env}
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID:?set in .env}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
    volumes: [uploads:/uploads:ro]
    networks: [internal, edge]
    mem_limit: 256m
    security_opt: ['no-new-privileges:true']

networks:
  internal: { internal: true }
  edge: {}

volumes:
  pgdata: {}
  uploads: {}
