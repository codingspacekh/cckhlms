<title>CCKH LMS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: classic dashboard — fixed light sidebar (role switch + nav), slim top bar, content of white cards on a cool neutral plane. One sans everywhere; data is the only loud thing. */
:root{
  --page:#F5F6F8; --surface:#FFFFFF; --surface-2:#F2F4F7; --line:#E4E7EC; --line-2:#D5DAE1;
  --ink:#101828; --ink-2:#475467; --muted:#8B94A3;
  --accent:#1C5CAB; --accent-2:#184F95; --accent-soft:#EAF1FB; --accent-ink:#FFFFFF;
  --s1:#2a78d6; --s1-wash:rgba(42,120,214,.10); --s2:#eb6834;
  --grid:#EDF0F3; --axis:#CDD3DB;
  --good:#0ca30c; --good-text:#056B05; --good-soft:#E7F5E7;
  --warn:#fab219; --warn-text:#875800; --warn-soft:#FEF4DC;
  --bad:#d03b3b; --bad-text:#A72A2A; --bad-soft:#FCE9E9;
  --py:#2a78d6; --java:#eb6834; --web:#6250d6;
  --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0F16; --surface:#141A24; --surface-2:#1A2230; --line:#232C3A; --line-2:#2E3849;
  --ink:#E8ECF3; --ink-2:#AEB7C6; --muted:#7F8A9C;
  --accent:#5598E7; --accent-2:#6DA7EC; --accent-soft:#17263D; --accent-ink:#06121F;
  --s1:#3987e5; --s1-wash:rgba(57,135,229,.16); --s2:#d95926;
  --grid:#1E2633; --axis:#344055;
  --good:#0ca30c; --good-text:#5BCB5B; --good-soft:#12301A;
  --warn:#fab219; --warn-text:#F2C04F; --warn-soft:#33280F;
  --bad:#d03b3b; --bad-text:#F28484; --bad-soft:#3A1717;
  --py:#3987e5; --java:#d95926; --web:#9085e9; color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#0B0F16; --surface:#141A24; --surface-2:#1A2230; --line:#232C3A; --line-2:#2E3849;
  --ink:#E8ECF3; --ink-2:#AEB7C6; --muted:#7F8A9C;
  --accent:#5598E7; --accent-2:#6DA7EC; --accent-soft:#17263D; --accent-ink:#06121F;
  --s1:#3987e5; --s1-wash:rgba(57,135,229,.16); --s2:#d95926;
  --grid:#1E2633; --axis:#344055;
  --good:#0ca30c; --good-text:#5BCB5B; --good-soft:#12301A;
  --warn:#fab219; --warn-text:#F2C04F; --warn-soft:#33280F;
  --bad:#d03b3b; --bad-text:#F28484; --bad-soft:#3A1717;
  --py:#3987e5; --java:#d95926; --web:#9085e9; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:14.5px/1.55 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;font-weight:600}
h1{font-size:1.5rem;letter-spacing:-.015em}
h2{font-size:1rem}
h3{font-size:.95rem}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.tnum{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:18px;padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 .78rem var(--f-mono)}
.brand b{font-weight:600;font-size:1rem}.brand small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2}
.rolebox{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.rolebox label{font-size:.72rem;color:var(--muted);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:.72rem;color:var(--muted);font-weight:500;padding:8px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;font-size:.72rem;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.proto{font-size:.75rem;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:8px 10px;line-height:1.45}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-weight:600;font-size:.8rem;flex:none}
.me .n{font-weight:600;font-size:.88rem;line-height:1.2}.me .r{font-size:.75rem;color:var(--muted)}
.me .btn{margin-left:auto}
.wrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.crumb{font-size:.85rem;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:500}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
main{padding-block:24px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:column;gap:12px;border-right:0;border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .side .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .rolebox{padding:0;flex-direction:row;align-items:center;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav .sec,.side .foot{display:none}
  .nav button{white-space:nowrap;border:1px solid var(--line)}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:18px}
}
@media (min-width:901px){.side .head{display:contents}}

/* ---- page header ---- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.phead .eyebrow{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.req{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* ---- cards & grids ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.chead p{font-size:.82rem;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}.ink2{color:var(--ink-2)}.small{font-size:.85rem}.xs{font-size:.78rem}
.list > *{padding-block:12px;border-top:1px solid var(--line)}.list > *:first-child{border-top:0;padding-top:0}.list > *:last-child{padding-bottom:0}

/* stat tile */
.tile{display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:.82rem;color:var(--ink-2);font-weight:500}
.tile .v{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .v small{font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:0}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile .spark{height:28px;margin-top:2px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:500;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-soft);color:var(--good-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn-text)}
.pill.bad{background:var(--bad-soft);color:var(--bad-text)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill svg{width:12px;height:12px;stroke-width:2.4}
.lang{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.lang::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:.88rem;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad-text)}
.btn.sm{padding:4px 9px;font-size:.8rem}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--ink-2);font-weight:500;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;color:var(--ink);width:100%;min-width:0;font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-weight:500;font-size:.82rem;color:var(--ink-2);border-radius:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(16 24 40 / .10),0 0 0 1px var(--line)}
.seg.att button[aria-pressed="true"][data-v="P"]{color:var(--good-text)}
.seg.att button[aria-pressed="true"][data-v="L"]{color:var(--warn-text)}
.seg.att button[aria-pressed="true"][data-v="A"]{color:var(--bad-text)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);padding:12px 14px;border-radius:var(--r-sm);font-size:.88rem}
.note svg{color:var(--accent);margin-top:2px}
.note.warn{background:var(--warn-soft)}.note.warn svg{color:var(--warn-text)}
.note.bad{background:var(--bad-soft)}.note.bad svg{color:var(--bad-text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:11px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:500;white-space:nowrap;background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td,tbody tr.click:focus-visible td{background:var(--surface-2)}
tr.click:focus-visible{outline:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:.78rem;color:var(--muted)}
.gb th.a{min-width:104px;vertical-align:bottom;white-space:normal;line-height:1.3}
.gb th.a .t{display:block;color:var(--ink);font-size:.8rem;font-weight:500}
.gb td{padding:6px 10px}
.gb input{width:62px;text-align:right;padding:5px 7px;font-variant-numeric:tabular-nums}
.gb td.na,.gb td.future{color:var(--muted);text-align:center;font-size:.78rem;white-space:nowrap}
.gb .sticky{position:sticky;left:0;background:var(--surface);z-index:1;white-space:nowrap}

/* charts */
.chart{position:relative}
svg.c{width:100%;height:auto;display:block;overflow:visible}
svg.c .gl{stroke:var(--grid);stroke-width:1}
svg.c .ax{stroke:var(--axis);stroke-width:1}
svg.c text{fill:var(--muted);font:11px var(--f);font-variant-numeric:tabular-nums}
svg.c text.v{fill:var(--ink-2);font-weight:500}
svg.c .bar{fill:var(--s1)}
svg.c .hb:hover .bar,svg.c .hb:focus .bar{fill:var(--accent-2)}
svg.c .hb,svg.c .hx{outline:none}
svg.c .ref{stroke:var(--ink-2);stroke-width:1;opacity:.55}
svg.c text.reflbl{fill:var(--ink-2);font-weight:500}
svg.c .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.c .dot{stroke:var(--surface);stroke-width:2}
svg.c .xh{stroke:var(--axis);stroke-width:1;opacity:0}
svg.c .hx:hover .xh,svg.c .hx:focus .xh{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:2px;background:var(--c)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar .l{font-size:.85rem;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.hbar .val{font-size:.85rem;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.hbar .track{grid-column:1 / -1;position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--s1)}
.hbar .tick{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-2);opacity:.6}
.meter{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--s1)}
.meter > i.warn{background:var(--warn)}.meter > i.bad{background:var(--bad)}
.meter > b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink-2);opacity:.6}
.viewtoggle{font-size:.78rem}
.ctable table{font-size:.82rem}.ctable th,.ctable td{padding:7px 10px}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:0 8px 24px rgb(16 24 40 / .14);padding:8px 10px;font-size:.8rem;min-width:130px}
#tip .t{color:var(--muted);margin-bottom:4px}
#tip .rw{display:flex;align-items:center;gap:10px;justify-content:space-between}
#tip .rw b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#tip .rw span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .rw i{width:12px;height:2px;border-radius:2px;background:var(--c)}

/* weeks strip */
.wkstrip{display:flex;gap:6px;flex-wrap:wrap}
.wkstrip span{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;font-weight:500;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.wkstrip span.done{background:var(--accent-soft);color:var(--accent)}
.wkstrip span.now{background:var(--accent);color:var(--accent-ink)}
.wkstrip span.x{background:transparent;border:1px dashed var(--line-2)}

/* editor */
.ide{display:grid;grid-template-columns:210px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);min-height:380px}
@media (max-width:700px){.ide{grid-template-columns:minmax(0,1fr)}}
.tree{background:var(--surface-2);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tree .dir{color:var(--muted);font-family:var(--f-mono);font-size:.72rem;padding:8px 8px 3px;word-break:break-all}
.tree button{border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;display:flex;justify-content:space-between;gap:6px;color:var(--ink-2)}
.tree button:hover{background:var(--surface)}
.tree button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tree .wm{color:var(--warn-text);font-weight:600}
.code{display:grid;grid-template-columns:auto minmax(0,1fr);font-family:var(--f-mono);font-size:.82rem;line-height:1.65;min-height:340px}
.gutter{padding:12px 10px;text-align:right;color:var(--muted);border-right:1px solid var(--line);user-select:none;white-space:pre;overflow:hidden;font-variant-numeric:tabular-nums}
.code textarea{border:0;border-radius:0;padding:12px 14px;font:inherit;line-height:inherit;white-space:pre;overflow:auto;resize:none;background:var(--surface);min-height:340px;tab-size:4}
.code textarea:focus{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.code pre{margin:0;padding:12px 14px;white-space:pre;overflow:auto}
.preview{display:grid;grid-template-rows:auto minmax(240px,1fr) auto;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.preview .bar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.preview iframe{width:100%;height:100%;min-height:260px;border:0;background:#fff}
.console{font-family:var(--f-mono);font-size:.75rem;max-height:120px;min-height:44px;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;background:var(--surface-2)}
.console div{padding:1px 0}.console .e{color:var(--bad-text)}.console .w{color:var(--warn-text)}

/* lesson body & Q&A */
.md h2{margin:18px 0 8px;font-size:1.05rem}.md h3{margin:14px 0 6px}.md p{margin:8px 0;max-width:68ch}.md ul{margin:8px 0;padding-left:22px}
.md pre{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;overflow:auto;font-family:var(--f-mono);font-size:.82rem;margin:8px 0}

function sessions(c){const out=[];let n=0,i=0;while(n<c.weeks){const d=addDays(c.first,7*i++);const k=iso(d);
  if(c.cancel[k]){out.push({date:d,cancelled:true,reason:c.cancel[k]});continue}
  n++;out.push({date:d,week:n,status:+d<+TODAY?'held':(+d===+TODAY?'today':'upcoming')})}return out}
const weekDate=(c,w)=>{const s=sessions(c).find(s=>s.week===w);return s?s.date:addDays(c.first,7*(w-1))};

function cellPoints(v,max){if(typeof v==='number')return Math.min(v,max);if(typeof v==='string'&&v[0]==='L')return +v.slice(1)*(1-LATE_PENALTY);return 0}
function standing(c,sid){                                                            // BR-12, BR-14, BR-17
  const acc={exam:[0,0],classwork:[0,0],homework:[0,0]};
  for(const a of ASSESS[c.id]||[]){
    if(!isDue(c,a)||beforeEnrol(c,sid,a))continue;
    const v=(SCORES[c.id]?.[sid]||{})[a.id];
    if(v==='E'||v==='S')continue;
    acc[a.type][0]+=cellPoints(v,a.max);acc[a.type][1]+=a.max}
  let used=0,sum=0;const parts={};
  for(const k in W){const[p,m]=acc[k];parts[k]=m?p/m*100:null;if(m){used+=W[k];sum+=W[k]*p/m}}
  return{score:used?Math.round(sum/used*1000)/10:null,parts,used};
}

/* ---------- tiny markdown (lesson notes) ---------- */
function md(src){const out=[];const lines=String(src||'').split('\n');let i=0,list=false;
  const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  while(i<lines.length){const l=lines[i];
    if(l.startsWith('```')){const buf=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))buf.push(lines[i++]);i++;if(list){out.push('</ul>');list=false}out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);continue}
    if(/^- /.test(l)){if(!list){out.push('<ul>');list=true}out.push(`<li>${inline(l.slice(2))}</li>`);i++;continue}
    if(list){out.push('</ul>');list=false}
    if(l.startsWith('### '))out.push(`<h3>${inline(l.slice(4))}</h3>`);else if(l.startsWith('## '))out.push(`<h2>${inline(l.slice(3))}</h2>`);else if(l.trim())out.push(`<p>${inline(l)}</p>`);i++}
  if(list)out.push('</ul>');return out.join('')}

function niceMax(m){if(m<=5)return 5;if(m<=10)return 10;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return(n<=2?2:n<=5?5:10)*p}
function colChart(items,{max=100,unit='%',ref=null,refLabel='',h=220,valueLabel=true}={}){
  const w=560,pl=40,pr=12,pt=18,pb=30,ch=h-pt-pb,cw=w-pl-pr,step=cw/items.length,bw=Math.min(24,step*.45);
  const y=v=>pt+ch-(Math.max(0,Math.min(v,max))/max)*ch;const base=pt+ch;
  let s=`<svg class="c" viewBox="0 0 ${w} ${h}" role="img" aria-label="Column chart">`;
  for(const t of [0,max/2,max]){s+=`<line class="${t?'gl':'ax'}" x1="${pl}" x2="${w-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t}${unit}</text>`}
  items.forEach((it,i)=>{const cx=pl+step*i+step/2,x=cx-bw/2,v=it.value;
    s+=`<g class="hb" tabindex="0" ${tipAttr(it.label,[[it.series||'Value',v==null?'—':`${Math.round(v)}${unit}`,'--s1']])}><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ch}" fill="transparent"/>`;
    if(v!=null&&v>0){const yt=y(v),r=Math.min(4,base-yt);s+=`<path class="bar" d="M${x},${base} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${base} Z"/>`;
      if(valueLabel)s+=`<text class="v" x="${cx}" y="${yt-6}" text-anchor="middle">${Math.round(v)}${unit}</text>`}
    s+=`</g><text x="${cx}" y="${h-10}" text-anchor="middle">${esc(it.short||it.label)}</text>`});
  if(ref!=null)s+=`<line class="ref" x1="${pl}" x2="${w-pr}" y1="${y(ref)}" y2="${y(ref)}"/><text class="reflbl" x="${w-pr}" y="${y(ref)-6}" text-anchor="end">${esc(refLabel)}</text>`;
  return s+'</svg>'}
function lineChart(series,{h=240,ref=PASS,refLabel=`Pass mark ${PASS}`}={}){
  const labels=series[0].points.map(p=>p.label),n=labels.length;const w=600,pl=40,pr=16,pt=16,pb=30,ch=h-pt-pb,cw=w-pl-pr;
  const x=i=>pl+(n<2?cw/2:cw*i/(n-1)),y=v=>pt+ch-(v/100)*ch;
  let s=`<svg class="c" viewBox="0 0 ${w} ${h}" role="img" aria-label="Line chart">`;
  for(const t of [0,50,100])s+=`<line class="${t?'gl':'ax'}" x1="${pl}" x2="${w-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  if(ref!=null)s+=`<line class="ref" x1="${pl}" x2="${w-pr}" y1="${y(ref)}" y2="${y(ref)}"/><text class="reflbl" x="${pl+6}" y="${y(ref)-6}">${esc(refLabel)}</text>`;
  const first=series[0];const p0=first.points.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.value)}`).join(' ');
  s+=`<path d="${p0} L${x(n-1)},${y(0)} L${x(0)},${y(0)} Z" fill="${first.wash}"/>`;
  [...series].reverse().forEach(se=>{s+=`<path class="ln" stroke="var(${se.color})" d="${se.points.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.value)}`).join(' ')}"/>`});
  series.forEach(se=>{const p=se.points[n-1];s+=`<circle class="dot" cx="${x(n-1)}" cy="${y(p.value)}" r="4.5" fill="var(${se.color})"/>`});
  const lp=first.points[n-1];s+=`<text class="v" x="${x(n-1)-8}" y="${y(lp.value)-10}" text-anchor="end">${Math.round(lp.value)}%</text>`;
  const band=n<2?cw:cw/(n-1);
  labels.forEach((l,i)=>{const rows=series.map(se=>[se.name,`${Math.round(se.points[i].value)}%`,se.color]);
    s+=`<g class="hx" tabindex="0" ${tipAttr(series[0].points[i].full||l,rows)}><rect x="${Math.max(pl,x(i)-band/2)}" y="${pt}" width="${band}" height="${ch}" fill="transparent"/><line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt+ch}"/></g>`;
    s+=`<text x="${x(i)}" y="${h-10}" text-anchor="middle">${esc(l)}</text>`});
  return s+'</svg>'}

function chartCard(title,sub,chart,table,{span=''}={}){const id='ch'+(++chartId);
  return`<section class="card ${span}"><div class="chead"><div><h2>${esc(title)}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="btn ghost sm viewtoggle" data-act="viewtable" data-id="${id}" aria-pressed="false">Table</button></div>

const tbl=(head,rows)=>`<table><thead><tr>${head.map((h,i)=>`<th class="${i?'n':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function spark(vals){if(vals.length<2)return'';const w=120,h=28,mx=100;const x=i=>i*(w-6)/(vals.length-1)+3,y=v=>h-3-(v/mx)*(h-6);
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" width="120" height="28" aria-hidden="true"><path d="${vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/></svg>`}
function weekendAttendance(){const m=new Map();for(const c of CLASSES)for(const s of sessions(c)){if(s.cancelled||s.status==='upcoming')continue;
  const sat=c.day==='Sun'?addDays(s.date,-1):s.date;const k=iso(sat);const e=m.get(k)||{date:sat,ok:0,den:0};
  for(const sid of c.roster){const ch=(ATT[c.id]?.[sid]||'')[s.week-1];if(!ch||ch==='-'||ch==='E')continue;e.den++;if(ch!=='A')e.ok++}m.set(k,e)}
  return[...m.values()].filter(e=>e.den).sort((a,b)=>a.date-b.date).map(e=>({label:`Weekend of ${fmt(e.date,{day:'numeric',month:'short'})}`,short:fmt(e.date,{day:'numeric',month:'short'}),value:e.ok/e.den*100}))}

   case 'file':proj().cur=v;render();break;
   case 'new-file':{const w=proj();const ext={py:'.py',java:'.java',web:'.html'}[st.work];let i=1;const base=st.work==='java'?'src/com/club/shapes/NewClass':'new_file';while(w.files[base+i+ext])i++;const name=base+i+ext;
     w.files[name]=st.work==='java'?`package com.club.shapes;\n\npublic class NewClass${i} {\n}\n`:'';w.cur=name;render();toast(`Created ${name.split('/').pop()}`);break}
   case 'fix-pkg':{const w=proj();const wn=javaWarnings(w.files)[w.cur];w.files[w.cur]=w.files[w.cur].replace(/^\s*package\s+[\w.]+\s*;/m,`package ${wn.want};`);render();toast('Package line fixed.');break}
   case 'submit':proj().submitted='Sun 18 Oct, 10:42';render();toast('Submitted. Your teacher can see it now.');break;
   case 'qa-report':{const q=QUESTIONS.find(x=>x.id===id);q.vis='review';q.reportedBy=ME;render();toast('Thanks. A teacher will look at it. It is hidden until then.');break}
   case 'qa-restore':QUESTIONS.find(x=>x.id===id).vis='visible';render();toast('Post restored.');break;
   case 'qa-remove':QUESTIONS.find(x=>x.id===id).vis='removed';render();toast('Post removed. The author is told it broke the class rules.');break;
  }
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='ncForm'){const n=st.nc;const first=new Date(n.first+'T00:00:00Z');if(isNaN(first)||first.getUTCDay()!==(n.day==='Sat'?6:0)){toast('Fix the first session date first.');return}
    const id='c'+(CLASSES.length+1);CLASSES.push({id,name:n.course,lang:COURSES[n.course],term:n.term,day:n.day,time:n.time,mins:n.mins,first,weeks:+n.weeks,teacher:n.teacher,room:n.room,roster:[],enrolled:{},cancel:{...n.cancel}});
    st.nc=null;go('classes');toast(`${n.course} created with ${n.weeks} weekly sessions.`);return}
  if(f.id==='addStudent'){const name=$('#as-name').value.trim()||'New Student';const parts=name.toLowerCase().split(/\s+/);const user=parts[0]+'.'+(parts[1]?.[0]||'x');
    st.shown={name,user,pw:newPassword()};render();toast(`Account created for ${name}.`);return}
  if(f.id==='gradeForm'){const s=$('#gr-score').value;if(s!==''){const row=SCORES.c1[st.grade.sid]||(SCORES.c1[st.grade.sid]={});const cur=row[st.grade.aid];row[st.grade.aid]=typeof cur==='string'&&cur[0]==='L'?'L'+s:+s}toast('Grade saved. The student sees the score and feedback now.');return}
  if(f.id==='askQ'){const b=$('#askBody').value.trim();if(!b){toast('Write your question first.');return}QUESTIONS.push({id:'q'+Date.now(),week:3,author:ME,body:b,code:$('#askCode').value.trim()||null,vis:'visible',replies:[]});render();toast('Question posted.');return}
  if(f.dataset.reply){const inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;QUESTIONS.find(q=>q.id===f.dataset.reply).replies.push({id:'r'+Date.now(),author:st.role==='teacher'?'T':ME,body:t});render();return}
  if(f.id==='signinForm'){const u=$('#si-user').value.trim().toLowerCase();setRole(u==='admin'?'admin':u.startsWith('sophea')?'teacher':'student');toast('Signed in.');return}
  if(f.id==='newWork'){toast('Homework published. Due at the start of the next session.');return}
  if(f.id==='weekReport'){REPORTS.c1[st.week]=true;toast('Weekly report saved.');return}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id&&t.id.startsWith('nc-')&&st.nc){const k=t.id.slice(3);st.nc[k]=k==='weeks'?+t.value:t.value;ncRefresh();return}
  if(t.id==='editor'){const w=proj();w.files[w.cur]=t.value;syncGutter();if(st.work==='web'){clearTimeout(pvTimer);pvTimer=setTimeout(refreshPreview,500)}
    if(st.work==='java'){clearTimeout(pvTimer);pvTimer=setTimeout(()=>{const pos=t.selectionStart;render();const ed=$('#editor');ed.focus();ed.setSelectionRange(pos,pos)},700)}return}
  if(t.id==='ls-md'||t.id==='ls-title'){const L=LESSONS.c1[st.week]||(LESSONS.c1[st.week]={status:'draft'});if(t.id==='ls-md')L.md=t.value;else L.title=t.value;$('#ls-preview').innerHTML=`<div class="xs muted">Preview</div><h2>${esc(L.title)}</h2>${md(L.md)}`;return}
  if(t.dataset.gb){const[sid,aid]=t.dataset.gb.split('|');const a=ASSESS.c1.find(x=>x.id===aid);const row=SCORES.c1[sid]||(SCORES.c1[sid]={});const cur=row[aid];
    if(t.value==='')row[aid]='M';else{const n=Math.max(0,Math.min(a.max,+t.value));row[aid]=typeof cur==='string'&&cur[0]==='L'?'L'+n:n}
    const cell=document.querySelector(`[data-standing="${sid}"]`);if(cell)cell.innerHTML=scorePill(standing(C('c1'),sid).score);return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='reportPick'){st.report=t.value;render();return}
  if(t.dataset.result){st.termTab[t.dataset.result]=t.value;render();return}
});
document.addEventListener('keydown',e=>{const t=e.target;
  if(t.id==='editor'&&e.key==='Tab'){e.preventDefault();const s=t.selectionStart,en=t.selectionEnd;t.value=t.value.slice(0,s)+'    '+t.value.slice(en);t.selectionStart=t.selectionEnd=s+4;t.dispatchEvent(new Event('input',{bubbles:true}))}
  if(t.dataset&&t.dataset.gb&&e.key==='Enter'){e.preventDefault();const[sid,aid]=t.dataset.gb.split('|');const ro=C('c1').roster;for(let i=ro.indexOf(sid)+1;i<ro.length;i++){const nx=document.querySelector(`[data-gb="${ro[i]}|${aid}"]`);if(nx){nx.focus();nx.select();return}}}
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('tr.click')){e.preventDefault();t.click()}
});
document.addEventListener('scroll',e=>{if(e.target.id==='editor'){const g=$('#gutter');if(g)g.scrollTop=e.target.scrollTop}},true);
render();
</script>
