# Every pull request must pass these five checks before it can merge (docs/05 §3.3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · lint · types · unit tests · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18-alpine
        env: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms-dev-only, POSTGRES_DB: lms_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lms" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://lms:lms-dev-only@localhost:5432/lms_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test:int:coverage

  e2e:
    name: E2E (Playwright + axe, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18-alpine
        env: { POSTGRES_USER: lms, POSTGRES_PASSWORD: lms-dev-only, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lms" --health-interval 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://lms:lms-dev-only@localhost:5432/lms_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-standalone.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Scan the full git history
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --no-banner --redact

  infra:
    name: Infrastructure (images, compose, backup round trip)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts (shellcheck, pinned; the runner's own copy is older)
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0 infra/server/provision.sh infra/server/deploy.sh infra/db-app-role.sh infra/backup/backup.sh infra/backup/restore.sh infra/backup/entrypoint.sh infra/tests/app-image.sh infra/tests/backup-restore.sh infra/tests/compose-config.sh infra/security/zap-baseline.sh tests/load/run.sh infra/tests/deploy-script.sh infra/tests/runner-image.sh
      - name: Production compose file
        run: sh infra/tests/compose-config.sh
      - name: Deploy script (version on every Compose command, rollback)
        run: sh infra/tests/deploy-script.sh
      - name: Backup → restore round trip
        run: sh infra/tests/backup-restore.sh
      - name: App image starts, migrates, reports its version
        run: GIT_SHA=${{ github.sha }} sh infra/tests/app-image.sh
      - name: Code runner (M11, ADR-0004) runs Python and Java within its limits and away from the network
        run: sh infra/tests/runner-image.sh
